name: Build APK

# Builds a debug APK automatically every time you push code to GitHub.
# You do not need Android Studio or a computer to use this -- GitHub
# runs the build on its own servers; you just download the finished
# APK from the "Actions" tab afterwards.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khutaa-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
